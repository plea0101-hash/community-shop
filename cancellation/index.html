<!doctype html>
<html lang="zh-Hant">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
 <meta name="referrer" content="no-referrer">
 <title>我的預約與取消管理｜鄰里好店</title>
 <link rel="stylesheet" href="style.css">
</head>
<body>
 <header><a href="../">◈ 鄰里好店</a><h1>我的預約與取消管理</h1><p>所有時間以臺灣時間顯示。取消後如需其他日期，請重新申請。</p></header>
 <main>
  <p class="notice">開發中的獨立預約模組。正式預約資料映射及 SQL 草稿尚待核准；目前首頁預約流程維持原狀。</p>
  <div id="message" role="status" aria-live="polite"></div>
  <form id="login"><h2>登入</h2><label>電子郵件<input name="email" type="email" autocomplete="username" required></label><label>密碼<input name="password" type="password" autocomplete="current-password" required></label><button>登入</button><p>僅使用既有 Supabase Auth 帳號。登入憑證只保留在本頁記憶體，重新整理需再次登入。</p></form>
  <section id="workspace" hidden>
   <div class="toolbar"><span id="identity"></span><button id="refresh">重新整理</button><button id="logout">登出</button></div>
   <nav aria-label="預約管理"><button data-view="vendor">廠商：我的預約</button><button data-view="community">社區：我的預約</button><button data-view="history">取消紀錄</button><button data-view="notifications">通知</button><button data-view="admin" id="admin-tab" hidden>管理員：查核與統計</button></nav>
   <div id="content"></div>
  </section>
 </main>
 <dialog id="cancel-dialog"><form id="cancel-form">
  <h2>確認取消預約</h2><div id="cancel-summary"></div>
  <label>取消原因<textarea name="reason" maxlength="2000" rows="3"></textarea></label>
  <label class="check"><input type="checkbox" name="typhoon">主張颱風特殊取消</label>
  <fieldset id="evidence" hidden><legend>政府正式公告資料（將由管理員核驗）</legend>
   <p>臺灣任一縣市因颱風正式停班或停課即可，不限雙方所在地。此選項不會取消其他預約。</p>
   <label>官方公告網址<input name="source_url" type="url" placeholder="https://…gov.tw/…"></label>
   <label>公告日期<input name="announced_on" type="date"></label>
   <label>適用日期<input name="applicable_on" type="date"></label>
   <label>公告縣市<select name="county"></select></label>
   <label>公告內容<select name="suspension"><option value="work">因颱風停班</option><option value="school">因颱風停課</option><option value="both">因颱風停班及停課</option></select></label>
  </fieldset>
  <label class="check"><input name="confirmed" type="checkbox" required>我確認取消此預約；取消後釋出時段，不能直接改期。</label>
  <p id="cancel-error" role="alert"></p><button type="button" data-close="cancel-dialog">返回</button><button type="submit">確認取消</button>
 </form></dialog>
 <dialog id="reapply-dialog"><form id="reapply-form"><h2>取消後重新申請</h2><p>會建立新的待審核申請，原取消紀錄保留；尚不代表已核准。社區提出的新申請須由廠商同意並完成正式審核後才能確認。</p><label>可申請時段<select name="slot" required></select></label><p id="reapply-error" role="alert"></p><button type="button" data-close="reapply-dialog">返回</button><button type="submit">送出新申請</button></form></dialog>
 <script src="../config.js"></script><script type="module" src="app.js"></script>
</body>
</html>
