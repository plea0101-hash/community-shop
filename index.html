<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>鄰里好店｜社區商店媒合平台</title><style>
:root{--ink:#19302b;--green:#176b55;--pale:#eaf4ee;--bg:#f7f8f5;--line:#dce5df;--muted:#66776f}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;color:var(--ink)}header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}.nav{max-width:1160px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:13px 20px;gap:10px}.logo{font-size:21px;font-weight:850;color:var(--green)}nav{display:flex;gap:5px;flex-wrap:wrap}button,.btn{border:0;background:var(--green);color:#fff;padding:11px 15px;border-radius:10px;cursor:pointer;font-weight:700;font-size:14px}nav button{background:transparent;color:var(--ink)}nav button.active{background:var(--pale);color:var(--green)}button.secondary{background:#e8eeeb;color:var(--ink)}button.outline{background:white;color:var(--green);border:1px solid var(--green)}button:disabled{opacity:.45;cursor:not-allowed}.wrap{max-width:1160px;margin:auto;padding:26px 20px 80px}.hero{background:linear-gradient(115deg,#e4f1e9,#f7eee0);border-radius:20px;padding:45px 35px;margin-bottom:24px}.hero h1{font-size:clamp(28px,4vw,43px);line-height:1.25;margin:8px 0}.hero p{color:#51685d;max-width:680px;line-height:1.8}.eyebrow{color:var(--green);font-weight:800;font-size:13px;letter-spacing:1px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 3px 14px #19302b07}.card h3{margin:3px 0 9px}.muted{color:var(--muted);font-size:14px}.pill{display:inline-block;border-radius:20px;padding:5px 10px;background:var(--pale);color:var(--green);font-size:12px;font-weight:750}.pill.gray{background:#edf0ee;color:#67756d}.pill.amber{background:#fff1d7;color:#8c5d10}.stack{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.section{margin:28px 0 16px}.section h2{margin:0 0 7px;font-size:25px}label{display:block;font-weight:700;font-size:13px;margin-bottom:7px}input,select,textarea{width:100%;border:1px solid #cfdcd4;border-radius:10px;padding:12px;background:#fff;font:inherit;color:var(--ink)}textarea{min-height:80px;resize:vertical}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{margin:0 0 16px}.layout{display:grid;grid-template-columns:290px 1fr;gap:20px}.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}.day{min-height:105px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:9px;cursor:pointer;text-align:left;color:var(--ink);font-weight:400}.day.free{background:#f0f9f2;border-color:#a8d6b9}.day.busy{background:#f3f5f4}.day.chosen{outline:3px solid var(--green)}.day small{display:block;color:var(--muted);font-size:11px;margin:5px 0}.day strong{font-size:18px}.day em{display:block;font-style:normal;font-size:12px;margin-top:9px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.tabs button{background:#e7ece8;color:var(--ink)}.tabs button.active{background:var(--green);color:#fff}.hidden{display:none!important}.metric{font-size:28px;font-weight:850;margin:6px 0}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:12px 9px;vertical-align:middle}th{color:var(--muted);font-size:12px}.alert{background:#fff5e4;border:1px solid #eed4a7;border-radius:12px;padding:12px 15px;color:#72511b;font-size:13px}.ok{background:#eaf6ed;border-color:#b8dec2;color:#28653b}.empty{text-align:center;color:var(--muted);padding:35px}.footer{font-size:12px;color:var(--muted);padding:20px 0}.space{height:12px}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.layout{grid-template-columns:1fr}.days{grid-template-columns:repeat(4,1fr)}.nav{align-items:flex-start;flex-direction:column}.hero{padding:30px 20px}}@media(max-width:520px){.grid,.two,.fields{grid-template-columns:1fr}.days{grid-template-columns:repeat(2,1fr)}nav button{padding:8px;font-size:12px}.wrap{padding:20px 14px 70px}.card{padding:16px}}
</style></head><body><header><div class="nav"><div class="logo">◈ 鄰里好店 <span style="font-size:11px;color:#81948a;font-weight:400">資料庫連線版</span></div><nav id="nav"><button data-page="home">首頁</button><button data-page="search">尋找社區</button><button data-page="calendar">檔期日曆</button><button data-page="apply">進駐申請</button><button data-page="admin">社區後台</button></nav></div></header><main class="wrap"><div id="connection" class="alert">正在讀取社區資料…</div><div id="app"></div></main><script src="config.js"></script><script>
const KEY='community-popups-demo-v1';const seed=[{id:'c1',name:'富宇原森活',area:'新竹',households:240,venue:'室內大廳',access:'僅限住戶',fee:1000,days:[1,2,3,4,5],desc:'室內展示桌、110V 插座，禁止明火。'},{id:'c2',name:'晴川花園',area:'竹北',households:380,venue:'戶外中庭',access:'僅限住戶',fee:800,days:[2,3,4,5,6],desc:'戶外遮雨棚可自備；雨天須改期。'},{id:'c3',name:'森光寓所',area:'桃園',households:520,venue:'戶外廣場',access:'可對外開放（待核驗）',fee:1500,days:[0,5,6],desc:'對外營業需另經場地及法規審核。'}];
const baseBookings=[{id:'b1',community:'c1',date:'2026-11-16',brand:'馬修嚴選',status:'confirmed'},{id:'b2',community:'c1',date:'2026-11-17',brand:'四方鮮乳',status:'confirmed'},{id:'b3',community:'c1',date:'2026-11-19',brand:'烘焙品牌',status:'confirmed'}];
let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}state={communities:[],bookings:[],applications:[]};let page='home',community='',week='2026-11-16',picked='',filterArea='全部',filterVenue='全部',adminTab='requests';const app=document.getElementById('app');function save(){localStorage.setItem(KEY,JSON.stringify(state))}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function localDate(s){return new Date(s+'T12:00:00')}function iso(d){let y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}function add(s,n){let d=localDate(s);d.setDate(d.getDate()+n);return iso(d)}function fmt(s){return s.replaceAll('-','/')}function cby(id){return state.communities.find(c=>c.id===id)}function booking(id,date){return state.bookings.find(b=>b.community===id&&b.date===date&&b.status==='confirmed')}function pending(id,date){return state.applications.some(a=>a.community===id&&a.date===date&&['pending','approved','payment'].includes(a.status))}function dayAllowed(c,date){return c.days.includes(localDate(date).getDay())}function available(c,date){return false} // 正式預約尚未開放，不以缺少預約資料推定空檔
function badge(s){let t={pending:'待審核',approved:'已核准／待付款',payment:'待付款',confirmed:'已確認',rejected:'已拒絕',cancelled:'已取消'};return `<span class="pill ${s==='pending'?'amber':s==='rejected'?'gray':''}">${t[s]||s}</span>`}function navigate(p){if(['apply','admin'].includes(p)){alert('此功能尚未開放：需先完成登入、審核權限與正式預約流程。');return}page=p;render();window.scrollTo(0,0)}document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>navigate(b.dataset.page));function header(t,sub){return `<div class="section"><h2>${t}</h2><div class="muted">${sub}</div></div>`}
function home(){return `<div class="hero"><div class="eyebrow">社區 × 品牌 × 住戶 × 平台</div><h1>把好店，帶到你家樓下。</h1><p>社區開放經核准的公共空間，品牌預訂固定檔期並現場販售。住戶看得見、買得到；社區與平台共享進駐服務收入。</p><div class="stack"><button onclick="navigate('search')">探索可預訂社區</button><button class="outline" onclick="navigate('admin')">進入社區管理後台</button></div></div><div class="grid">${[['社區','讓空間創造收入','自主決定室內／戶外、住戶專屬或合規對外開放'],['品牌廠商','建立固定實體通路','看日曆、選空檔、申請進駐，不必逐一打電話'],['住戶','每天樓下有不同好店','透過社區公告或 QR Code 查看品牌進駐時程']].map(x=>`<div class="card"><div class="eyebrow">${x[0]}</div><h3>${x[1]}</h3><div class="muted">${x[2]}</div></div>`).join('')}</div>${header('已核准社區','以下資料由 Supabase 即時讀取；線上申請與預約尚未開放。')}<div class="grid">${state.communities.map(c=>communityCard(c)).join('')}</div>`}
function communityCard(c){return `<div class="card"><div class="stack"><span class="pill">${esc(c.venue)}</span><span class="pill gray">${esc(c.access)}</span></div><h3 style="margin-top:14px">${esc(c.name)}</h3><p class="muted">${esc(c.area)} · ${c.households ?? '未提供'} 戶</p><p class="muted">${esc(c.desc)}</p><div class="stack" style="justify-content:space-between"><strong>NT$${c.fee.toLocaleString()}／場</strong><button onclick="community='${c.id}';navigate('calendar')">查看場地</button></div></div>`}
function search(){let cs=state.communities.filter(c=>(filterArea==='全部'||c.area===filterArea)&&(filterVenue==='全部'||c.venue.includes(filterVenue)));return `${header('尋找社區','篩選地區與場地類型，查看可預訂檔期。')}<div class="card"><div class="fields"><div><label>地區</label><select onchange="filterArea=this.value;render()">${['全部',...new Set(state.communities.map(c=>c.area))].map(x=>`<option ${filterArea===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>場地類型</label><select onchange="filterVenue=this.value;render()">${['全部','室內','戶外'].map(x=>`<option ${filterVenue===x?'selected':''}>${x}</option>`).join('')}</select></div></div></div><div class="space"></div><div class="grid">${cs.length?cs.map(communityCard).join(''):'<div class="empty">沒有符合條件的社區</div>'}</div>`}
function calendar(){let c=cby(community)||state.communities[0];if(!c)return header('檔期日曆','目前沒有可公開顯示的場地。');let days=Array.from({length:7},(_,i)=>add(week,i));let status=(d)=>{let b=booking(c.id,d);return '尚未開放線上預約'};return `${header('檔期日曆','場地資訊來自 Supabase；預約查詢與申請尚未開放。')}<div class="layout"><aside class="card"><label>選擇社區</label><select onchange="community=this.value;picked='';render()">${state.communities.map(x=>`<option value="${x.id}" ${x.id===c.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select><h3>${esc(c.name)}</h3><p class="muted">${esc(c.area)} · ${esc(c.venue)} · ${esc(c.access)}</p><p class="muted">${esc(c.desc)}</p><hr style="border:0;border-top:1px solid var(--line)"><div class="muted">每場費用</div><div class="metric">NT$${c.fee.toLocaleString()}</div><div class="alert">此頁僅供查看場地資訊，尚不接受線上預約或付款。</div></aside><div class="card"><div class="stack" style="justify-content:space-between"><h3>每週可預訂時段</h3><div class="stack"><button class="secondary" onclick="week=add(week,-7);picked='';render()">← 上週</button><button class="secondary" onclick="week=add(week,7);picked='';render()">下週 →</button></div></div><p class="muted">${fmt(days[0])} — ${fmt(days[6])}｜開放時段尚待社區公告</p><div class="days">${days.map((d,i)=>{let a=available(c,d),b=booking(c.id,d);return `<button class="day ${a?'free':'busy'} ${picked===d?'chosen':''}" onclick="picked='${d}';render()"><small>${['一','二','三','四','五','六','日'][i]} · ${d.slice(5)}</small><strong>${d.slice(-2)}</strong><em>${esc(status(d))}</em></button>`}).join('')}</div><div class="space"></div><div class="card" style="background:#f7faf8"><strong>${picked?fmt(picked):'請選擇日期'}</strong><p class="muted">${picked?esc(status(picked)):'目前不提供線上申請；場地檔期尚未公開。'}</p>${picked&&available(c,picked)?`<button onclick="navigate('apply')">申請此檔期</button>`:''}</div></div></div>`}
function apply(){let c=cby(community);if(!c)return header('進駐申請','目前沒有可申請場地。');return `${header('廠商進駐申請','請填寫基本資料、販售商品及設備需求。送出後進入待審核，不代表預訂成功。')}<div class="layout"><div class="card"><h3>預訂資訊</h3><p><strong>${esc(c.name)}</strong></p><p class="muted">${esc(c.venue)} · ${esc(c.access)}</p><p>${picked?fmt(picked):'尚未選擇日期'}</p><p>17:00–20:00</p><div class="metric">NT$${c.fee.toLocaleString()}</div><button class="secondary" onclick="navigate('calendar')">重新選擇檔期</button></div><form class="card" id="form"><h3>進駐資料</h3><div class="fields"><div class="field"><label>品牌名稱 *</label><input name="brand" required placeholder="例如：XX 烘焙坊"></div><div class="field"><label>公司／商業統編 *</label><input name="taxid" required pattern="[0-9]{8}" maxlength="8" placeholder="8 位數字"></div><div class="field"><label>聯絡人 *</label><input name="contact" required></div><div class="field"><label>聯絡電話 *</label><input name="phone" required></div><div class="field"><label>商品類別</label><select name="category"><option>烘焙／甜點</option><option>乳製品／冷藏食品</option><option>咖啡／飲品</option><option>蔬果／農產品</option><option>其他零售</option></select></div><div class="field"><label>現場人員數</label><select name="staff"><option>1</option><option selected>2</option><option>3</option><option>4 人以上</option></select></div></div><div class="field"><label>預計販售商品 *</label><textarea name="products" required placeholder="請列出主要商品"></textarea></div><div class="field"><label>設備與用電需求 *</label><textarea name="equipment" required placeholder="例如：展示桌、冷藏櫃 300W、110V"></textarea></div><div class="field"><label>食品資格與品牌授權說明</label><textarea name="credentials" placeholder="例如：食品業者登錄字號、品牌直營或授權資訊（示範版不收取證件）"></textarea></div><label style="font-weight:400"><input style="width:auto" type="checkbox" required name="consent"> 我了解申請須經審核，並同意示範場地規範。</label><div class="space"></div><button type="submit" ${!picked||!available(c,picked)?'disabled':''}>送出進駐申請</button><p class="muted">本原型僅在此瀏覽器儲存資料，不會傳送至伺服器。</p></form></div>`}
function admin(){let pendingApps=state.applications.filter(a=>a.status==='pending');let confirmed=state.bookings.filter(b=>b.status==='confirmed');return `${header('社區管理後台','示範版提供申請審核、預訂管理及場地設定。')}<div class="grid"><div class="card"><div class="muted">合作社區</div><div class="metric">${state.communities.length}</div></div><div class="card"><div class="muted">待審核申請</div><div class="metric">${pendingApps.length}</div></div><div class="card"><div class="muted">已確認場次</div><div class="metric">${confirmed.length}</div></div></div><div class="space"></div><div class="tabs">${[['requests','進駐審核'],['bookings','檔期管理'],['venues','場地設定']].map(([k,v])=>`<button class="${adminTab===k?'active':''}" onclick="adminTab='${k}';render()">${v}</button>`).join('')}</div>${adminTab==='requests'?requests():adminTab==='bookings'?bookingsView():venuesView()}<div class="footer"><button class="secondary" onclick="if(confirm('確定清除本機操作紀錄並恢復示範資料？')){localStorage.removeItem(KEY);location.reload()}">重設示範資料</button></div>`}
function requests(){return `<div class="card"><h3>廠商申請清單</h3>${!state.applications.length?'<div class="empty">目前沒有新申請。請先從「檔期日曆」選擇空檔並送出申請。</div>':`<div class="tablewrap"><table><thead><tr><th>品牌</th><th>社區／日期</th><th>商品與設備</th><th>狀態</th><th>審核操作</th></tr></thead><tbody>${state.applications.map(a=>`<tr><td><strong>${esc(a.brand)}</strong><div class="muted">${esc(a.contact)} · ${esc(a.phone)}</div></td><td>${esc(cby(a.community)?.name)}<div class="muted">${fmt(a.date)}</div></td><td>${esc(a.products)}<div class="muted">${esc(a.equipment)}</div></td><td>${badge(a.status)}</td><td>${a.status==='pending'?`<div class="stack"><button onclick="approve('${a.id}')">核准</button><button class="secondary" onclick="reject('${a.id}')">拒絕</button></div>`:a.status==='approved'?`<button onclick="pay('${a.id}')">模擬付款確認</button>`:'—'}</td></tr>`).join('')}</tbody></table></div>`}</div>`}
function bookingsView(){return `<div class="card"><h3>已確認的檔期</h3><div class="tablewrap"><table><thead><tr><th>社區</th><th>日期</th><th>廠商</th><th>狀態</th><th>操作</th></tr></thead><tbody>${state.bookings.map(b=>`<tr><td>${esc(cby(b.community)?.name)}</td><td>${fmt(b.date)}</td><td>${esc(b.brand)}</td><td>${badge(b.status)}</td><td>${b.status==='confirmed'?`<button class="secondary" onclick="cancelBooking('${b.id}')">取消</button>`:'—'}</td></tr>`).join('')}</tbody></table></div></div>`}
function venuesView(){return `<div class="grid">${state.communities.map(c=>`<div class="card"><h3>${esc(c.name)}</h3><p class="muted">${esc(c.venue)} · ${esc(c.access)}</p><div class="field"><label>場次費（NT$）</label><input id="fee-${c.id}" type="number" min="0" value="${c.fee}"></div><div class="field"><label>場地說明</label><textarea id="desc-${c.id}">${esc(c.desc)}</textarea></div><button onclick="updateVenue('${c.id}')">儲存場地設定</button></div>`).join('')}</div>`}
function render(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));app.innerHTML=({home,search,calendar,apply,admin}[page])();if(page==='apply'){document.getElementById('form').onsubmit=submitApp}}function submitApp(e){e.preventDefault();let c=cby(community);if(!picked||!available(c,picked)){alert('檔期已被占用或尚未開放，請重新選擇。');navigate('calendar');return}let v=Object.fromEntries(new FormData(e.target).entries());let a={...v,id:'a'+Date.now(),community,date:picked,status:'pending',created:new Date().toISOString()};state.applications.push(a);save();alert('示範申請已建立！請前往「社區後台 → 進駐審核」處理。');adminTab='requests';navigate('admin')}function approve(id){let a=state.applications.find(x=>x.id===id);if(!a)return;if(booking(a.community,a.date)){alert('此檔期已被其他廠商預訂。');return}a.status='approved';save();render()}function reject(id){let a=state.applications.find(x=>x.id===id);if(a){a.status='rejected';save();render()}}function pay(id){let a=state.applications.find(x=>x.id===id);if(!a)return;if(booking(a.community,a.date)){alert('檔期衝突，無法確認。');return}a.status='confirmed';state.bookings.push({id:'b'+Date.now(),community:a.community,date:a.date,brand:a.brand,status:'confirmed'});save();alert('已模擬付款確認並寫入共用檔期日曆。');render()}function cancelBooking(id){if(!confirm('確定取消此預訂？'))return;let b=state.bookings.find(x=>x.id===id);if(b){b.status='cancelled';let a=state.applications.find(x=>x.community===b.community&&x.date===b.date&&x.brand===b.brand&&x.status==='confirmed');if(a)a.status='cancelled';save();render()}}function updateVenue(id){let c=cby(id),v=Number(document.getElementById('fee-'+id).value);if(!Number.isFinite(v)||v<0)return alert('請輸入有效費用');c.fee=v;c.desc=document.getElementById('desc-'+id).value;save();alert('場地設定已儲存在此瀏覽器');render()}async function loadPublicData(){
 const notice=document.getElementById('connection');
 const config=window.COMMUNITY_SHOP_CONFIG||{};
 if(!config.url||!config.publishableKey||config.publishableKey.includes('請填入')){
   notice.textContent='尚未設定 Supabase 公開連線資訊。請先編輯 config.js。';render();return;
 }
 const base=config.url.replace(/\/$/,'');
 const headers={apikey:config.publishableKey,Authorization:'Bearer '+config.publishableKey};
 async function get(table,query){let r=await fetch(base+'/rest/v1/'+table+'?'+query,{headers});if(!r.ok)throw new Error(table+' HTTP '+r.status);return r.json()}
 try{
  const [communities,venues]=await Promise.all([
   get('communities','select=id,name,city,district,households,status&status=eq.approved'),
   get('venues','select=id,community_id,name,location_type,capacity,has_power,fee,status&status=eq.available')
  ]);
  const byCommunity=new Map();for(const v of venues){if(!byCommunity.has(v.community_id))byCommunity.set(v.community_id,[]);byCommunity.get(v.community_id).push(v)}
  state.communities=communities.flatMap(c=>(byCommunity.get(c.id)||[]).map(v=>({
   id:String(c.id)+'-'+String(v.id),name:c.name,area:[c.city,c.district].filter(Boolean).join(' '),
   households:c.households,venue:v.name,access:'開放條件請洽社區',fee:v.fee,
   days:[],desc:(v.location_type==='outdoor'?'戶外':v.location_type==='indoor'?'室內':'場地')+' · '+(v.has_power?'提供用電':'用電請洽社區'),venueId:v.id
  })));
  community=state.communities[0]?.id||'';
  notice.textContent=state.communities.length?'已連線 Supabase，顯示已核准社區及可用場地；尚未開放線上預約。':'已連線 Supabase，目前沒有符合公開條件的社區場地。';
  notice.classList.add('ok');render();
 }catch(err){notice.textContent='無法讀取 Supabase 資料（'+err.message+'）。請檢查公開金鑰、網址、RLS 及 Data API 設定。';render()}
}
render();loadPublicData();
</script></body></html>
